#
#  One-click demo: DB + migrations + API + frontend.
#
#  Run:     docker compose -f WholeAppDemo.yaml up -d
#  Open:    https://localhost:8443 (use a trusted certificate for public demos)
#  HTTP:    http://localhost:8080 redirects to HTTPS
#  Update:  re-run the same command - images are re-pulled every time (pull_policy: always)
#  Reset:   docker compose -f WholeAppDemo.yaml down -v   (wipes the demo database)
#
#  All values are hard coded on purpose. This file is for demo purposes only, never for real use.
#

name: poolgame-demo

x-sql-connection: &sql-connection "Server=db,1433;Database=Demo-DB;User Id=sa;Password=DemoOnly_1234!;TrustServerCertificate=True;"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "DemoOnly_1234!"
    ports:
      - "127.0.0.1::1433"
    volumes:
      - demo-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

 
  migrations:
    image: rishaviq/poolgame-migrations:latest
    pull_policy: always
    restart: "no"
    environment:
      SQL__CONNECTION: *sql-connection
    depends_on:
      db:
        condition: service_healthy

  tls-certs:
    image: alpine:3.22
    restart: "no"
    command:
      - /bin/sh
      - -c
      - >-
        if [ ! -s /certs/fullchain.pem ] || [ ! -s /certs/privkey.pem ]; then
          apk add --no-cache openssl && openssl req -x509 -newkey rsa:2048 -sha256 -days 365 -nodes -keyout /certs/privkey.pem -out /certs/fullchain.pem -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1";
        fi
    volumes:
      - demo-tls-certs:/certs

  api:
    image: rishaviq/poolgame-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      JWT__EXPIRATIONINMINUTES: "1400"
      JWT__AUDIENCE: "audience"
      JWT__ISSUER: "issuer"
      JWT__SECRET: "demo-only-jwt-secret-key-at-least-32-characters-long"
      SQL__CONNECTION: *sql-connection
    ports:
      - "127.0.0.1:5002:8080"   
    depends_on:
      migrations:
        condition: service_completed_successfully

  
  web:
    image: rishaviq/react-app:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint:
        - /bin/sh
        - -c
        - >-
            grep -rlF "https://poolgameapi.com/api/v2" /usr/share/nginx/html
            | xargs -r sed -i "s|https://poolgameapi.com/api/v2|/api/v2|g"
            && exec nginx -g "daemon off;"
    configs:
      - source: web-nginx
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - demo-tls-certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      api:
        condition: service_started
      tls-certs:
        condition: service_completed_successfully

volumes:
  demo-db-data:
  demo-tls-certs:

configs:
  web-nginx:
    content: |
      server {
        listen 80;
        server_name _;
        return 301 https://$$host:8443$$request_uri;
      }

      server {
        listen 443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location /api/v2/ {
          proxy_pass http://api:8080/;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
        }

        location / {
          try_files $$uri /index.html;
        }
      }
